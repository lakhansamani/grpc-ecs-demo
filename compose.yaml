name: ecomgrpc

# Local AWS emulator + observability.
# No database service here: each service embeds SQLite on its own task filesystem
# (see SPEC.md section 6). The RDS path is kept in terraform but not applied.
services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: ministack
    ports:
      - "4566:4566"
      # NOTE: do NOT publish the RDS port range here. Ministack starts each RDS
      # instance as its own Postgres container that binds its host port directly;
      # claiming the range on this container makes CreateDBInstance fail with
      # "port is already allocated".
    environment:
      - GATEWAY_PORT=4566
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Put ECS tasks + RDS containers on the same network as jaeger/prometheus,
      # otherwise a task cannot reach jaeger:4317.
      - DOCKER_NETWORK=ecom-infra
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ecom-infra]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ministack-redis
    networks: [ecom-infra]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    container_name: jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
    networks: [ecom-infra]

  # Scrapes the ECS task containers. The `task` label is what makes the
  # load-balancing demo visible: you can see one task taking all the traffic.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    # The image runs as nobody, which cannot read the Docker socket, and
    # docker_sd_configs then fails with "permission denied" while the
    # container itself looks perfectly healthy. Local demo only.
    user: root
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    networks: [ecom-infra]


networks:
  ecom-infra:
    name: ecom-infra
