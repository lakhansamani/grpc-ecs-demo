version: v2
managed:
  enabled: false
plugins:
  # ---- Go: messages + gRPC server/client stubs ----
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  # require_unimplemented_servers stays ON (default) so adding an RPC to the
  # proto without implementing it is a compile error, not a runtime 501.
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go
    opt: paths=source_relative

  # ---- REST: a JSON/HTTP reverse proxy, generated from the SAME protos ----
  # Only the RPCs carrying a google.api.http option get a route. The gateway
  # exposes a deliberate SUBSET - e.g. ProductService.CheckAvailability has no
  # annotation and so is unreachable from the internet.
  - remote: buf.build/grpc-ecosystem/gateway:v2.31.0
    out: gen/go
    opt: paths=source_relative
  # ---- and the OpenAPI spec the frontend team actually asks for ----
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.31.0
    out: gen/openapi
    opt:
      - allow_merge=true
      - merge_file_name=api

  # ---- TypeScript: messages + service descriptors ----
  - remote: buf.build/bufbuild/es:v2.16.0
    out: clients/node/src/gen
    opt: target=ts
